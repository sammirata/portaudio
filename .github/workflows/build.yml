name: build

permissions:
  contents: write

on:
  push:
    branches: [sipradius]
    tags: ["pa-v*"]
  workflow_dispatch:

jobs:
  windows:
    name: win32-x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build portaudio_x64.dll
        shell: cmd
        run: |
          copy ci\msvc\portaudio.vcxproj build\msvc\
          copy ci\msvc\portaudio.def build\msvc\
          cd build\msvc
          msbuild /nologo /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 portaudio.vcxproj
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          cp "build/msvc/x64/Release/portaudio_x64.dll" dist/
          cp "build/msvc/x64/Release/portaudio_x64.lib" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: portaudio-win32-x64
          path: dist/
          retention-days: 30
      - name: Attach to the tag's release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  macos:
    name: darwin-universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build libportaudio.dylib
        run: |
          set -euo pipefail
          # One build per architecture, merged with lipo: configure's own
          # universal probe silently drops x86_64 on current Xcode.
          build_arch() {
            arch=$1 min=$2 host=$3
            git clean -fdxq -e dist
            CC="clang -arch $arch" CFLAGS="-arch $arch -mmacosx-version-min=$min" \
              LDFLAGS="-arch $arch -mmacosx-version-min=$min" \
              ./configure --disable-mac-universal --host="$host"
            # configure.in forces -Werror on darwin; current clang warns on
            # unused variables that the v19.7.0-era compilers accepted.
            sed -i '' 's/ -Werror//' Makefile
            if grep -q -- '-Werror' Makefile; then echo "-Werror still present"; exit 1; fi
            make -j"$(sysctl -n hw.ncpu)" lib/libportaudio.la
            cp -L lib/.libs/libportaudio.dylib "dist/libportaudio-$arch.dylib"
          }
          mkdir dist
          build_arch x86_64 10.13 x86_64-apple-darwin
          build_arch arm64 11.0 aarch64-apple-darwin
          lipo -create dist/libportaudio-x86_64.dylib dist/libportaudio-arm64.dylib \
            -output dist/libportaudio.dylib
          rm dist/libportaudio-*.dylib
          install_name_tool -id @rpath/libportaudio.dylib dist/libportaudio.dylib
          ARCHS=$(lipo -archs dist/libportaudio.dylib)
          echo "archs: $ARCHS"
          case "$ARCHS" in *x86_64*) ;; *) echo "missing x86_64"; exit 1;; esac
          case "$ARCHS" in *arm64*) ;; *) echo "missing arm64"; exit 1;; esac
          otool -D dist/libportaudio.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: portaudio-darwin-universal
          path: dist/
          retention-days: 30
      - name: Attach to the tag's release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  linux:
    name: linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libportaudio.so.2
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
          ./configure --without-jack
          make -j"$(nproc)"
          objdump -p lib/.libs/libportaudio.so.2.0.0 | grep -E 'SONAME|NEEDED'
          mkdir dist
          cp lib/.libs/libportaudio.so.2.0.0 dist/libportaudio.so.2
      - uses: actions/upload-artifact@v4
        with:
          name: portaudio-linux-x64
          path: dist/
          retention-days: 30
      - name: Attach to the tag's release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
